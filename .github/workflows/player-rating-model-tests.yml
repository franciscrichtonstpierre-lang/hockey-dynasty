name: Player rating model tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/lib/advanced-player-rating-model.mjs"
      - "tests/advanced-player-rating-model.test.mjs"
      - "tests/ratings-invariants.test.mjs"
      - "player-development.js"
      - "tests/player-development.test.mjs"
      - "index.html"

permissions:
  contents: read

jobs:
  rating-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository test suite
        run: node --test tests/*.test.mjs
