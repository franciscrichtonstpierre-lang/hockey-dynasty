if(tab==="Équipes"){h='<h2>32 organisations LNH</h2>'+card("Ton équipe",'<select onchange="setTeam(this.value)">'+teams.map((t,i)=>'<option value="'+i+'" '+(i===S.team?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select><p class="muted">Choisis une organisation pour consulter son état et accéder à ses outils de gestion.</p>')+'<div class="grid">'+teams.map((t,i)=>'<div class="tile" onclick="setTeam('+i+')" style="cursor:pointer"><small>'+(i+1)+'/32</small><b style="font-size:14px">'+esc(t)+'</b>'+(S.team===i?'<small>✓ Sélectionnée</small>':'')+'</div>').join('')+'</div>'}
if(tab==="Statut organisation"){let myPicks=S.picks.filter(p=>p.owner===S.team).length;h='<h2>Statut de l’organisation · '+esc(team)+'</h2><div class="grid">'+[['Saison',S.season+'–'+(S.season+1)],['Bilan',S.w+'-'+S.l+'-'+S.otl],['Points',S.w*2+S.otl],['Choix détenus',myPicks],['Jours simulés',S.day],['Effectif vérifié','À compléter']].map(x=>'<div class="tile"><small>'+x[0]+'</small><b>'+esc(x[1])+'</b></div>').join('')+'</div><br>'+card('État du dossier','<div class="item"><span>Effectif LNH</span><span class="tag">Données consultables</span></div><div class="item"><span>Club-école LAH</span><span class="tag">Affiliation enregistrée</span></div><div class="item"><span>Espoirs et droits</span><span class="tag">Base incomplète</span></div><div class="item"><span>Contrats et masse salariale</span><span class="tag">À développer</span></div><div class="item"><span>Direction et objectifs</span><span class="tag">À configurer</span></div>')+card('Gestion rapide','<div class="controls">'+action('Ouvrir l’effectif','goSub(\'Effectif\')')+action('Modifier l’alignement','goSub(\'Alignement\')')+action('Plan d’entraînement','goSub(\'Entraînement\')')+action('Voir les choix','goSub(\'Choix\')')+'</div><p class="muted">Les indicateurs affichés proviennent de la sauvegarde locale. Les contrats, le plafond salarial, la direction et les objectifs ne sont pas encore simulés.</p>')}
if(tab==="Entraînement"){h='<h2>Entraînement · '+esc(team)+'</h2>'+card('Plan d’entraînement','<p class="muted">Choisis les priorités de développement de ton équipe. Les paramètres sont sauvegardés sur cet appareil. Ils ne modifient pas encore les attributs des joueurs : le moteur de progression reste à construire.</p><div class="item"><div><strong>Priorité de l’équipe</strong><div class="muted"><small>Orientation générale des séances</small></div></div><select id="trainingFocus" onchange="saveTraining()">'+['Équilibré','Attaque','Défense','Développement des jeunes','Avantage numérique','Désavantage numérique','Conditionnement'].map(v=>'<option '+(S.training.focus===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="item"><div><strong>Intensité</strong><div class="muted"><small>Charge globale de travail</small></div></div><select id="trainingIntensity" onchange="saveTraining()">'+['Légère','Normale','Élevée'].map(v=>'<option '+(S.training.intensity===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="item"><div><strong>Entraînement des gardiens</strong><div class="muted"><small>Priorité spécifique aux gardiens</small></div></div><select id="trainingGoalie" onchange="saveTraining()">'+['Technique','Réflexes','Contrôle des rebonds','Normale'].map(v=>'<option '+(S.training.goalie===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><label for="trainingNotes">Notes du personnel</label><textarea id="trainingNotes" rows="3" placeholder="Objectifs, joueurs à surveiller..." onchange="saveTraining()">'+esc(S.training.notes||'')+'</textarea><p id="trainingSaved" class="muted">Plan enregistré localement.</p>')+card('Prochaine étape','<p>À développer : fatigue individuelle, blessures, progression selon l’âge et le potentiel, personnel d’entraîneurs, séances quotidiennes et rapports de développement.</p>')}

if(tab==="Espoirs"){h='<h2>Banque d’espoirs</h2>'+card("Espoirs · "+esc(team),S.team===14?prospects.map(p=>item(p[0],p[1]+" · "+p[2],p[3],p[4])).join(''):'<p>Espoirs à intégrer avec leurs droits LNH et leurs ligues.</p>')}

if(tab==="Repêchage"){h='<h2>Repêchage amateur</h2>'+card("Sélection fictive",'<p>Consomme un choix pour repêcher un espoir fictif.</p><div class="controls"><select id="draftPick">'+mine.map(p=>'<option value="'+p.id+'">'+p.year+' · R'+p.round+'</option>').join('')+'</select>'+action("Repêcher","draft()")+'</div>')+card("Sélections",S.drafted.length?S.drafted.map(x=>'<div class="item">'+esc(x)+'</div>').join(''):'<p>Aucune sélection.</p>')}

function setTeam(i){S.team=Number(i);save();render()}function line(slot,v){if(!S.lines||Array.isArray(S.lines))S.lines={};S.lines[slot]=v;save();let p=el("lineupSaved");if(p)p.textContent="Alignement sauvegardé sur cet appareil."}function saveTraining(){S.training={focus:el("trainingFocus")?.value||"Équilibré",intensity:el("trainingIntensity")?.value||"Normale",goalie:el("trainingGoalie")?.value||"Normale",notes:el("trainingNotes")?.value||""};save();let p=el("trainingSaved");if(p)p.textContent="Plan enregistré sur cet appareil."}

function draft(){let p=S.picks.find(p=>p.id===el("draftPick")?.value&&p.owner===S.team);if(!p)return msg("Aucun choix disponible.");let name="Espoir fictif #"+(S.drafted.length+1)+" ("+p.year+" R"+p.round+")";S.drafted.push(name);S.picks=S.picks.filter(x=>x!==p);save();render();msg(name+" repêché.")}
function simulate(){let n=0;for(let d=1;d<=14;d++)if(Math.random()<.52){n++;let a=Math.floor(Math.random()*6),b=Math.floor(Math.random()*6);if(a===b){if(Math.random()<.5)a++;else b++}S.gf+=a;S.ga+=b;if(a>b)S.w++;else if(Math.random()<.25)S.otl++;else S.l++;S.history.push("Jour "+(S.day+d)+" · "+teams[S.team]+" "+a+"–"+b+" Adversaire simulé")}S.day+=14;S.history=S.history.slice(-60);save();render();msg(n+" matchs simulés sur 14 jours.")}

const codes=["ANA","BOS","BUF","CGY","CAR","CHI","COL","CBJ","DAL","DET","EDM","FLA","LAK","MIN","MTL","NSH","NJD","NYI","NYR","OTT","PHI","PIT","SJS","SEA","STL","TBL","TOR","UTA","VAN","VGK","WSH","WPG"];
async function loadLineup(){let box=el("lineupLive");if(!box)return;let roster=[];try{let r=await fetch("./data/nhl/"+codes[S.team]+".json");if(r.ok){let d=await r.json();roster=[...(d.forwards||[]).map(p=>({name:(p.firstName?.default||"")+" "+(p.lastName?.default||""),pos:p.positionCode||"F"})),...(d.defensemen||[]).map(p=>({name:(p.firstName?.default||"")+" "+(p.lastName?.default||""),pos:"D"})),...(d.goalies||[]).map(p=>({name:(p.firstName?.default||"")+" "+(p.lastName?.default||""),pos:"G"}))].filter(p=>p.name.trim())}}catch(e){}if(!roster.length&&S.team===14)roster=players.map(p=>({name:p[0],pos:p[1]==="D"?"D":p[1]==="G"?"G":"F"}));if(!roster.length){box.innerHTML='<p class="warning">Aucun effectif local disponible pour cette équipe. Ouvre « Effectifs LNH 2026–27 » et vérifie si le fichier est disponible.</p>';return}if(!S.lines||Array.isArray(S.lines))S.lines={};let groups=[{title:"Attaquants · 4 trios",pos:"F",slots:[["L1AG","Trio 1 · Ailier gauche"],["L1C","Trio 1 · Centre"],["L1AD","Trio 1 · Ailier droit"],["L2AG","Trio 2 · Ailier gauche"],["L2C","Trio 2 · Centre"],["L2AD","Trio 2 · Ailier droit"],["L3AG","Trio 3 · Ailier gauche"],["L3C","Trio 3 · Centre"],["L3AD","Trio 3 · Ailier droit"],["L4AG","Trio 4 · Ailier gauche"],["L4C","Trio 4 · Centre"],["L4AD","Trio 4 · Ailier droit"]]},{title:"Défenseurs · 3 paires",pos:"D",slots:[["D1G","Paire 1 · Gauche"],["D1D","Paire 1 · Droite"],["D2G","Paire 2 · Gauche"],["D2D","Paire 2 · Droite"],["D3G","Paire 3 · Gauche"],["D3D","Paire 3 · Droite"]]},{title:"Gardiens",pos:"G",slots:[["G1","Gardien partant"],["G2","Gardien auxiliaire"]]}];box.innerHTML=groups.map(g=>'<h3>'+g.title+'</h3>'+g.slots.map((slot,i)=>{let opts=roster.filter(p=>g.pos==="F"?p.pos!=="D"&&p.pos!=="G":p.pos===g.pos);let selected=S.lines[slot[0]]||"";return '<div class="item"><div><strong>'+slot[1]+'</strong></div><select aria-label="'+slot[1]+'" onchange="line(\''+slot[0]+'\',this.value)"><option value="">— À assigner —</option>'+opts.map(p=>'<option value="'+esc(p.name)+'" '+(selected===p.name?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></div>'}).join('')).join('')+'<p id="lineupSaved" class="muted">Les modifications sont sauvegardées automatiquement.</p><p class="muted">Les joueurs peuvent être réutilisés dans plusieurs cases pour le moment. Les unités d’avantage numérique, de désavantage numérique et la validation automatique des positions seront ajoutées ensuite.</p>'}

async function loadRoster(){let idx=Number(el("realTeam")?.value);if(!Number.isInteger(idx)||!el("rosterLive"))return;let panel=el("rosterLive");panel.innerHTML="Chargement du roster...";try{let res=await fetch("./data/nhl/"+codes[idx]+".json");if(!res.ok)throw Error("Réponse "+res.status);let data=await res.json();let groups=[["Attaquants",data.forwards],["Défenseurs",data.defensemen],["Gardiens",data.goalies]];let total=groups.reduce((n,g)=>n+(g[1]||[]).length,0);if(!total)throw Error("Aucun joueur retourné");const attrs=["FI","SH","PL","ST","CH","PO","HI","SK","EN","PE","FA","LE","SR","OFF","DEF","OA"];const rows=groups.map(([label,arr])=>'<tr class="groupRow"><th colspan="23">'+label+' ('+(arr||[]).length+')</th></tr>'+ (arr||[]).map(p=>{let name=(p.firstName?.default||"")+" "+(p.lastName?.default||"");let pos=p.positionCode||"—";return '<tr><td class="playerName">'+esc(name.trim())+'</td><td>'+codes[idx]+'</td><td>'+esc(pos)+'</td><td>—</td><td>—</td><td>—</td><td>—</td>'+attrs.map(()=>'<td class="ratingCell">—</td>').join('')+'</tr>'}).join('')).join('');panel.innerHTML='<h3>'+esc(teams[idx])+' · '+total+' joueurs</h3><p class="muted">Source : NHL · '+esc(data._sourceSeason==='current'?'effectif actuel (repli)':'saison 2026–27')+' · synchronisé '+esc((data._syncedUTC||'').slice(0,10))+'</p><p class="muted">Présentation inspirée du tableau SHM. Les tirets signalent les informations qui ne sont pas encore dans notre base; aucun salaire, âge ou attribut n’est inventé.</p><div class="rosterTools"><input id="rosterSearch" placeholder="Rechercher un joueur..." oninput="filterRoster()" aria-label="Rechercher un joueur"><span class="muted">Défile horizontalement pour voir toutes les colonnes.</span></div><div class="rosterScroll"><table class="rosterTable"><thead><tr><th>Nom du joueur</th><th>Équipe</th><th>Pos.</th><th>Alt.</th><th>Âge</th><th>Salaire</th><th>Ans</th>'+attrs.map(a=>'<th>'+a+'</th>').join('')+'</tr></thead><tbody id="rosterRows">'+rows+'</tbody></table></div><p class="muted">À compléter : contrats vérifiés, positions alternatives, âge à la date de référence et évaluations de jeu de 0 à 99.</p>'}catch(err){panel.innerHTML='<p>Impossible de charger cet effectif pour le moment : '+esc(err.message)+'.</p><p class="muted">La synchronisation automatique des données est peut-être encore en cours. Réessaie dans quelques minutes.</p>'+action("Réessayer","loadRoster()")}}
function filterRoster(){let q=(el("rosterSearch")?.value||"").toLocaleLowerCase("fr");document.querySelectorAll("#rosterRows tr:not(.groupRow)").forEach(row=>{row.style.display=row.cells[0]?.textContent.toLocaleLowerCase("fr").includes(q)?"":"none"})}


async function loadAhlAffiliations(){let box=el("ahlLive");if(!box)return;try{let r=await fetch("./data/ahl/teams.json");if(!r.ok)throw Error("Fichier "+r.status);let d=await r.json();let selected=codes[S.team];box.innerHTML='<p><strong>Ton organisation :</strong> '+esc(teams[S.team])+' → <strong>'+esc((d.teams.find(t=>t.nhlCode===selected)||{}).ahlName||"À vérifier")+'</strong></p><div class="item"><strong>Équipe LNH</strong><strong>Club-école LAH</strong></div>'+d.teams.map(t=>'<div class="item" style="'+(t.nhlCode===selected?'background:#1b3b55;border-radius:8px;padding:10px;':'')+'"><span>'+esc(teams[codes.indexOf(t.nhlCode)]||t.nhlCode)+'</span><strong>'+esc(t.ahlName)+'</strong></div>').join('')+'<p class="muted">Source : <a href="https://theahl.com/nhl-affiliations" target="_blank" rel="noopener" style="color:#8edcff">site officiel de la LAH</a>. Les effectifs LAH individuels et les droits des espoirs restent à importer.</p>'}catch(e){box.innerHTML='<p>Impossible de charger les affiliations : '+esc(e.message)+'</p>'}}
async function checkDatabase(){let box=el("dbStatus");if(!box)return;let results=await Promise.all(codes.map(async c=>{try{let r=await fetch("./data/nhl/"+c+".json");if(!r.ok)return {c,n:0,ok:false};let d=await r.json();return {c,n:["forwards","defensemen","goalies"].reduce((a,k)=>a+(d[k]||[]).length,0),ok:true,season:d._sourceSeason||"?"}}catch(e){return {c,n:0,ok:false}}}));let ok=results.filter(x=>x.ok),sum=ok.reduce((a,x)=>a+x.n,0);box.innerHTML='<div class="grid"><div class="tile"><small>Fichiers LNH disponibles</small><b>'+ok.length+'/32</b></div><div class="tile"><small>Joueurs dans les fichiers</small><b>'+sum+'</b></div></div><p class="muted">Les effectifs affichés sont des instantanés fournis par les fichiers synchronisés. Leur présence ne garantit pas que chaque joueur ou contrat de 2026–27 soit définitif.</p><details><summary>Voir l’état par équipe</summary>'+results.map(x=>'<div class="item"><span>'+esc(x.c)+'</span><span class="tag">'+(x.ok?x.n+' joueurs':'Fichier absent')+'</span></div>').join('')+'</details>'}
render();
</script></body></html>
