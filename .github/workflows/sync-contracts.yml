name: Sync 2026-27 contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"
  push:
    paths:
      - "scripts/sync-contracts.mjs"
      - ".github/workflows/sync-contracts.yml"

permissions:
  contents: write

jobs:
  sync-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import contract and salary data
        run: node scripts/sync-contracts.mjs
      - name: Audit database
        id: audit
        run: node scripts/validate-database.mjs
      - name: Commit refreshed contract snapshot
        run: |
          if git diff --quiet -- data/contracts/2026-2027.json; then
            echo "No contract data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contracts/2026-2027.json
          git commit -m "Refresh 2026-27 contract and salary data"
          git pull --rebase origin main
          git push
