name: Refresh player ratings
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
permissions:
  contents: write
jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build league-wide ratings from NHL stats
        run: node scripts/build-ratings.mjs
      - name: Commit refreshed ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json
          if git diff --cached --quiet; then
            echo "Ratings unchanged"
          else
            git commit -m "Refresh league-wide player ratings"
            git push
          fi
