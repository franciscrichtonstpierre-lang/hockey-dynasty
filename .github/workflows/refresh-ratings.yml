name: Refresh player ratings (requires approved data rights)
on:
  # Manual only. build-ratings.mjs checks the central rights registry and blocks
  # the legacy NHL Stats REST source until a free commercial grant is verified.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hockey-dynasty-data-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build league-wide ratings from NHL stats
        run: node scripts/build-ratings.mjs
      - name: Complete shared ratings for every registered player
        run: node scripts/apply-player-ratings.mjs
      - name: Export completed player directory
        run: node scripts/export-registry-index.mjs
      - name: Test complete shared player ratings
        run: node --test tests/*.test.mjs
      - name: Verify generated rating files
        run: |
          test -s data/ratings.json
          test -s data/players/registry.json
          test -s data/players/registry-index/manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("data/players/registry.json","utf8")); const keys=["FI","SH","PL","ST","CH","PO","HI","SK","EN","PE","FA","LE","SR","OFF","DEF","OA"]; if(!r.players?.length) throw Error("empty registry"); for(const p of r.players){if(!keys.every(k=>Number.isInteger(p.attributes?.[k])&&p.attributes[k]>=0&&p.attributes[k]<=99)) throw Error("incomplete ratings: "+p.id); const a=p.attributes; if(a.OFF!==Math.round((a.SH+a.PL+a.ST)/3)||a.DEF!==Math.round((a.CH+a.PO+a.HI)/3)||a.OA!==Math.round(keys.filter(k=>k!=="FI"&&k!=="OA").reduce((s,k)=>s+a[k],0)/14)||p.overall!==a.OA) throw Error("rating formula mismatch: "+p.id);} console.log("Validated "+r.players.length+" complete player cards.");'
      - name: Commit refreshed ratings and roster lookup
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "uhm-ratings-bot"
          git config user.email "uhm-ratings-bot@users.noreply.github.com"
          git add data/ratings.json data/players/registry.json data/players/registry-index data/free-agents/2026-2027.json
          if git diff --cached --quiet; then
            echo "Ratings and roster lookup already current."
          else
            git commit -m "Refresh complete player ratings and roster lookup"
            git push origin "HEAD:${GITHUB_REF}"
          fi
