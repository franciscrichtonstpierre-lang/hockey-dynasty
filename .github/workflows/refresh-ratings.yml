name: Valider les cotes des joueurs
on:
  push:
    paths:
      - "scripts/build-ratings.mjs"
      - "scripts/apply-player-ratings.mjs"
      - "scripts/lib/cross-league-rating-model.mjs"
      - "scripts/lib/player-ratings.mjs"
      - "scripts/export-registry-index.mjs"
      - "scripts/import-ehm-ratings.mjs"
      - "rating-presentation.js"
      - "docs/EHM-2026-2027-import.md"
      - "data/europe/**"
      - "tests/**"
      - ".github/workflows/refresh-ratings.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
permissions:
  contents: read
concurrency:
  group: hockey-dynasty-ratings-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tester le modèle partagé et les données de joueurs
        run: node --test tests/*.test.mjs
      - name: Vérifier les fichiers de données publiés
        run: |
          test -s data/ratings.json
          test -s data/players/registry.json
          test -s data/players/registry-index/manifest.json
