name: Synchroniser les données multi-ligues (droits commerciaux requis)

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Saison au format AAAABBBB"
        required: true
        default: "20262027"

permissions:
  contents: write

# Prevent overlapping sync jobs from racing while committing generated data.
concurrency:
  group: hockey-dynasty-data-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les droits commerciaux de toutes les sources
        run: node scripts/check-sync-source-rights.mjs
      - name: Synchroniser effectifs et espoirs LNH
        continue-on-error: true
        env:
          UHM_SEASON: ${{ inputs.season || '20262027' }}
        run: node scripts/sync-nhl-data.mjs
      - name: Synchroniser les 32 effectifs LAH
        continue-on-error: true
        env:
          UHM_AHL_SEASON_ID: "94"
        run: node scripts/sync-ahl-data.mjs
      - name: Synchroniser les statistiques individuelles LAH
        if: success()
        env:
          UHM_AHL_SEASON_ID: "94"
        run: node scripts/sync-ahl-player-stats.mjs
      - name: Ajouter les statistiques AHL et ECHL 2025-26 comme solution de repli
        if: success()
        continue-on-error: true
        run: node scripts/sync-prior-season-player-stats.mjs
      - name: Synchroniser les 30 effectifs ECHL
        if: success()
        continue-on-error: true
        env:
          UHM_ECHL_SEASON_ID: "78"
        run: node scripts/sync-echl-data.mjs
      - name: Compléter les biographies et dates de naissance ECHL
        if: success()
        continue-on-error: true
        env:
          UHM_ECHL_SEASON_ID: "78"
        run: node scripts/enrich-echl-bios.mjs
      - name: Compléter les biographies OHL, WHL, QMJHL et USHL
        if: success()
        continue-on-error: true
        run: node scripts/enrich-junior-bios.mjs
      - name: Synchroniser les statistiques ECHL et junior
        if: success()
        run: node scripts/sync-cross-league-player-stats.mjs
      - name: Synchroniser les espoirs des repêchages 2027–2029
        if: success()
        continue-on-error: true
        run: node scripts/sync-future-draft-prospects.mjs
      - name: Synchroniser les statistiques individuelles NCAA
        if: success()
        run: node scripts/sync-ncaa-player-stats.mjs
      - name: Vérifier la syntaxe du connecteur européen
        if: success()
        run: node --check scripts/sync-european-player-stats.mjs
      - name: Synchroniser les statistiques européennes SHL et Liiga
        if: success()
        continue-on-error: true
        run: node scripts/sync-european-player-stats.mjs
      - name: Compléter les biographies NCAA 2026-27
        if: success()
        continue-on-error: true
        run: node scripts/enrich-ncaa-bios.mjs
      - name: Compléter les dates des futurs espoirs 2027-2029
        if: success()
        continue-on-error: true
        run: node scripts/enrich-future-draft-bios.mjs
      - name: Construire le registre central des joueurs
        if: success()
        run: node scripts/build-player-registry.mjs
      - name: Compléter les dates de naissance depuis l’API NHL
        if: success()
        continue-on-error: true
        run: node scripts/enrich-nhl-player-bios.mjs
      - name: Synchroniser les propriétaires des choix de repêchage
        if: success()
        continue-on-error: true
        run: node scripts/sync-draft-picks.mjs
      - name: Compléter les cotes des joueurs de toutes les ligues
        if: success()
        run: node scripts/apply-player-ratings.mjs
      - name: Exporter le registre complet pour la recherche du jeu
        if: success()
        run: node scripts/export-registry-index.mjs
      - name: Tester le modèle partagé et les données de toutes les ligues
        run: node --test tests/*.test.mjs
      - name: Vérifier la syntaxe JavaScript de l’interface
        run: node scripts/check-inline-js.mjs
      - name: Vérifier la complétude des bases LNH, LAH, espoirs et contrats
        run: node scripts/validate-database.mjs
      - name: Publier les fichiers actualisés
        if: success()
        run: |
          git config user.name "uhm-data-bot"
          git config user.email "uhm-data-bot@users.noreply.github.com"
          git add data/nhl data/echl data/junior data/ncaa data/europe data/free-agents/2026-2027.json data/ratings.json data/players/junior-bio-enrichment.json data/players/ncaa-bio-enrichment.json data/players/future-draft-bio-enrichment.json data/prospects data/prospects-supplemental data/future-draft-prospects data/ahl data/coaches data/players/registry.json data/players/registry-index data/players/nhl-player-bios.json data/players/nhl-player-bio-audit.json data/contracts/2026-2027.json data/contracts/contract-audit-2026-2027.json data/contracts/manual-overrides-2026-2027.json data/contracts/db-sync data/draft-picks
          if git diff --cached --quiet; then
            echo "Aucune modification de données."
          else
            git commit -m "Synchroniser les effectifs LNH, LAH et espoirs"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git -c rebase.autoStash=true rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Rebase concurrent impossible, nouvelle tentative $attempt/5."
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:main; then
                echo "Données publiées après $attempt tentative(s)."
                exit 0
              fi
              echo "Push concurrent, nouvelle tentative $attempt/5."
              sleep $((attempt * 2))
            done
            echo "Échec de publication après 5 tentatives."
            exit 1
          fi
