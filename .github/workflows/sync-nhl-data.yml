name: Synchroniser les données LNH

on:
  push:
    paths:
      - ".github/workflows/sync-nhl-data.yml"
      - "index.html"
      - "scripts/sync-ahl-data.mjs"
      - "scripts/sync-ahl-player-stats.mjs"
      - "scripts/sync-cross-league-player-stats.mjs"
      - "scripts/apply-player-ratings.mjs"
      - "scripts/lib/cross-league-rating-model.mjs"
      - "scripts/lib/player-ratings.mjs"
      - "scripts/export-registry-index.mjs"
      - "scripts/sync-echl-data.mjs"
      - "scripts/enrich-echl-bios.mjs"
      - "scripts/enrich-junior-bios.mjs"
      - "scripts/enrich-ncaa-bios.mjs"
      - "scripts/enrich-future-draft-bios.mjs"
      - "scripts/sync-nhl-data.mjs"
      - "scripts/build-player-registry.mjs"
      - "scripts/enrich-nhl-player-bios.mjs"
      - "scripts/sync-future-draft-prospects.mjs"
      - "scripts/sync-contracts.mjs"
      - "data/contracts/2026-2027.json"
      - "data/contracts/manual-overrides-2026-2027.json"
      - "data/contracts/db-sync/**"
      - "scripts/sync-draft-picks.mjs"
      - "scripts/validate-database.mjs"
      - "scripts/check-inline-js.mjs"
      - "tests/**"
      - "data/ahl/teams.json"
      - "data/prospects/**"
      - "data/prospects-supplemental/**"
      - "data/future-draft-prospects/**"
      - "data/draft-picks/**"
      - "data/coaches/**"
      - "data/players/manual-league-corrections.json"
      - "data/junior/**"
      - "data/free-agents/2026-2027.json"
  workflow_dispatch:
    inputs:
      season:
        description: "Saison au format AAAABBBB"
        required: true
        default: "20262027"
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write

# Prevent overlapping sync jobs from racing while committing generated data.
concurrency:
  group: hockey-dynasty-data-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchroniser effectifs et espoirs LNH
        continue-on-error: true
        env:
          UHM_SEASON: ${{ inputs.season || '20262027' }}
        run: node scripts/sync-nhl-data.mjs
      - name: Synchroniser les 32 effectifs LAH
        continue-on-error: true
        env:
          UHM_AHL_SEASON_ID: "94"
        run: node scripts/sync-ahl-data.mjs
      - name: Synchroniser les statistiques individuelles LAH
        if: always()
        env:
          UHM_AHL_SEASON_ID: "94"
        run: node scripts/sync-ahl-player-stats.mjs
      - name: Synchroniser les 30 effectifs ECHL
        if: always()
        continue-on-error: true
        env:
          UHM_ECHL_SEASON_ID: "78"
        run: node scripts/sync-echl-data.mjs
      - name: Compléter les biographies et dates de naissance ECHL
        if: always()
        continue-on-error: true
        env:
          UHM_ECHL_SEASON_ID: "78"
        run: node scripts/enrich-echl-bios.mjs
      - name: Compléter les biographies OHL, WHL, QMJHL et USHL
        if: always()
        continue-on-error: true
        run: node scripts/enrich-junior-bios.mjs
      - name: Synchroniser les statistiques ECHL et junior
        if: always()
        run: node scripts/sync-cross-league-player-stats.mjs
      - name: Synchroniser les espoirs des repêchages 2027–2029
        if: always()
        continue-on-error: true
        run: node scripts/sync-future-draft-prospects.mjs
      - name: Compléter les biographies NCAA 2026-27
        if: always()
        continue-on-error: true
        run: node scripts/enrich-ncaa-bios.mjs
      - name: Compléter les dates des futurs espoirs 2027-2029
        if: always()
        continue-on-error: true
        run: node scripts/enrich-future-draft-bios.mjs
      - name: Construire le registre central des joueurs
        if: always()
        run: node scripts/build-player-registry.mjs
      - name: Compléter les dates de naissance depuis l’API NHL
        if: always()
        continue-on-error: true
        run: node scripts/enrich-nhl-player-bios.mjs
      - name: Importer les contrats, salaires et clauses vérifiés
        if: always()
        run: node scripts/sync-contracts.mjs
      - name: Synchroniser les propriétaires des choix de repêchage
        if: always()
        continue-on-error: true
        run: node scripts/sync-draft-picks.mjs
      - name: Compléter les cotes des joueurs de toutes les ligues
        if: always()
        run: node scripts/apply-player-ratings.mjs
      - name: Exporter le registre complet pour la recherche du jeu
        if: always()
        run: node scripts/export-registry-index.mjs
      - name: Tester le modèle partagé et les données de toutes les ligues
        run: node --test tests/*.test.mjs
      - name: Vérifier la syntaxe JavaScript de l’interface
        run: node scripts/check-inline-js.mjs
      - name: Vérifier la complétude des bases LNH, LAH, espoirs et contrats
        run: node scripts/validate-database.mjs
      - name: Publier les fichiers actualisés
        if: success()
        run: |
          git config user.name "uhm-data-bot"
          git config user.email "uhm-data-bot@users.noreply.github.com"
          git add data/nhl data/echl data/junior data/free-agents/2026-2027.json data/ratings.json data/players/junior-bio-enrichment.json data/players/ncaa-bio-enrichment.json data/players/future-draft-bio-enrichment.json data/prospects data/prospects-supplemental data/future-draft-prospects data/ahl data/coaches data/players/registry.json data/players/registry-index data/players/nhl-player-bios.json data/players/nhl-player-bio-audit.json data/contracts/2026-2027.json data/contracts/contract-audit-2026-2027.json data/contracts/manual-overrides-2026-2027.json data/contracts/db-sync data/draft-picks
          if git diff --cached --quiet; then
            echo "Aucune modification de données."
          else
            git commit -m "Synchroniser les effectifs LNH, LAH et espoirs"
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            git push origin HEAD:main
          fi
