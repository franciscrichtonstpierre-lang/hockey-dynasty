name: Exporter l'index compact du registre joueurs

on:
  push:
    paths:
      - ".github/workflows/export-registry-index.yml"
      - "scripts/export-registry-index.mjs"
      - "data/players/registry.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hockey-dynasty-registry-index
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exporter les identités en petits fichiers
        run: node scripts/export-registry-index.mjs
      - name: Publier l'index compact
        run: |
          git config user.name "uhm-data-bot"
          git config user.email "uhm-data-bot@users.noreply.github.com"
          git add data/players/registry-index
          if git diff --cached --quiet; then
            echo "L'index compact est déjà à jour."
          else
            git commit -m "Exporter l'index compact du registre joueurs"
            git fetch origin main
            git -c rebase.autoStash=true rebase -X theirs origin/main
            git push origin HEAD:main
          fi
