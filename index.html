// Persistent, gradual development. Only players with actual NHL roster IDs are affected.
if(!S.development)S.development={};
function developPlayers(days){
 const roster=window.hdRosterCache||[];
 let improved=0;
 for(const p of roster){
  const id=String(p.id||p.playerId||"");if(!id)continue;
  const age=p.birthDate?Math.floor((Date.now()-new Date(p.birthDate).getTime())/31557600000):27;
  const current=S.development[id]||{delta:0,experience:0};
  const ceiling=age<=22?8:age<=25?5:age<=28?2:age<=32?1:-2;
  current.experience+=days;
  if(current.experience>=56){
   current.experience-=56;
   const chance=age<=22?.62:age<=25?.43:age<=28?.19:age<=32?.08:.12;
   if(Math.random()<chance){
    const change=age>=33?-1:1;
    const next=Math.max(-4,Math.min(ceiling,current.delta+change));
    if(next!==current.delta){current.delta=next;if(change>0)improved++}
   }
  }
  S.development[id]=current;
 }
 return improved;
}

let uhmStage="welcome";

function leagueStatus(message){const node=document.getElementById("uhmLeagueStatus");if(node)node.textContent=message}
async function loadOnlineLeagues(){const box=document.getElementById("uhmLeagueList");if(!box)return;if(!authClient||!signedInUser){box.innerHTML='<div class="card">Connecte-toi pour gérer tes ligues en ligne.</div>';return}box.innerHTML='<div class="card">Chargement de tes ligues...</div>';try{const {data:owned,error:ownedError}=await authClient.from("leagues").select("id,name,join_code,owner_id,created_at").eq("owner_id",signedInUser.id).order("created_at",{ascending:false});if(ownedError)throw ownedError;const {data:members,error:membersError}=await authClient.from("league_members").select("league_id,role,team_id").eq("user_id",signedInUser.id);if(membersError)throw membersError;const ids=(members||[]).map(m=>m.league_id).filter(id=>!(owned||[]).some(l=>l.id===id));let joined=[];if(ids.length){const result=await authClient.from("leagues").select("id,name,join_code,owner_id,created_at").in("id",ids);if(result.error)throw result.error;joined=result.data||[]}const leagues=[...(owned||[]),...joined];box.innerHTML=leagues.length?'<div class="card"><h3>Mes ligues en ligne</h3>'+leagues.map(l=>'<div class="item"><div><strong>'+esc(l.name)+'</strong><div class="muted"><small>Code : '+esc(l.join_code||"—")+(l.owner_id===signedInUser.id?' · Commissaire':' · Membre')+'</small></div></div><button type="button" onclick="enterOnlineLeague(\''+l.id+'\')">Ouvrir</button></div>').join("")+'</div>':'<div class="card">Tu n’as pas encore de ligue en ligne. Crée-en une ci-dessus ou rejoins-en une avec un code.</div>'}catch(e){box.innerHTML='<div class="card warning">Impossible de charger les ligues : '+esc(e.message||"Erreur Supabase")+'. Vérifie que le script supabase/league-setup.sql a été exécuté dans Supabase.</div>'}}
async function createOnlineLeague(event){event.preventDefault();if(!authClient||!signedInUser){leagueStatus("Connecte-toi avant de créer une ligue.");return}const name=document.getElementById("uhmLeagueName")?.value.trim();if(!name){leagueStatus("Entre un nom de ligue.");return}leagueStatus("Création de la ligue...");try{const bytes=new Uint8Array(4);crypto.getRandomValues(bytes);const code=Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();const {data:league,error}=await authClient.from("leagues").insert({name,owner_id:signedInUser.id,commissioner_id:signedInUser.id,join_code:code}).select("id,name,join_code,owner_id,commissioner_id").single();if(error)throw error;const {error:memberError}=await authClient.from("league_members").insert({league_id:league.id,user_id:signedInUser.id,role:"commissioner"});if(memberError){console.warn("League created; membership insert failed",memberError)}leagueStatus("Ligue créée! Ton code à partager : "+league.join_code);document.getElementById("uhmCreateLeagueForm")?.reset();await loadOnlineLeagues()}catch(e){leagueStatus("Échec de création : "+(e.message||"Erreur Supabase")+". Si les colonnes ne correspondent pas, exécute le fichier supabase/league-setup.sql dans Supabase.")}}
async function joinOnlineLeague(event){event.preventDefault();if(!authClient||!signedInUser){leagueStatus("Connecte-toi avant de rejoindre une ligue.");return}const code=(document.getElementById("uhmJoinCode")?.value||"").trim().toUpperCase();if(!code){leagueStatus("Entre le code de la ligue.");return}leagueStatus("Recherche de la ligue...");try{const {data:league,error}=await authClient.from("leagues").select("id,name,join_code").eq("join_code",code).single();if(error)throw error;const {error:memberError}=await authClient.from("league_members").upsert({league_id:league.id,user_id:signedInUser.id,role:"manager"},{onConflict:"league_id,user_id"});if(memberError)throw memberError;leagueStatus("Tu as rejoint la ligue « "+league.name+" ».");document.getElementById("uhmJoinLeagueForm")?.reset();await loadOnlineLeagues()}catch(e){leagueStatus("Impossible de rejoindre cette ligue : "+(e.message||"code invalide")+". Vérifie le code et la configuration Supabase.")}}
async function enterOnlineLeague(id){if(!authClient||!signedInUser){leagueStatus("Connecte-toi pour ouvrir ta ligue.");return}leagueStatus("Ouverture de la ligue...");try{const {data:league,error}=await authClient.from("leagues").select("id,name,join_code,owner_id").eq("id",id).single();if(error)throw error;const isOwner=league.owner_id===signedInUser.id;const box=el("uhmGateway");uhmStage="leagueDetail";box.innerHTML='<h2>🏒 '+esc(league.name)+'</h2><div class="card"><h3>Ma ligue en ligne</h3><p><strong>Rôle :</strong> '+(isOwner?'Commissaire':'Membre')+'</p><p><strong>Code d’invitation :</strong> '+esc(league.join_code||"—")+'</p><p class="muted">La ligue est enregistrée dans Supabase. La sélection des équipes, les effectifs partagés et les simulations multijoueurs ne sont pas encore disponibles.</p></div><div class="controls"><button id="uhmBackToLeagues">Retour à mes ligues</button><button id="uhmLocalDemo">Jouer à la démo locale</button></div>';box.querySelector("#uhmBackToLeagues").onclick=()=>uhmShowStage("leagues");box.querySelector("#uhmLocalDemo").onclick=()=>uhmShowStage("game");window.scrollTo(0,0)}catch(e){leagueStatus("Impossible d’ouvrir la ligue : "+(e.message||"Erreur Supabase"))}}

function uhmShowStage(stage){uhmStage=stage;document.body.classList.toggle("uhmGate",stage!=="game");document.body.classList.toggle("uhmGame",stage==="game");const gate=el("uhmGateway");if(!gate)return;if(stage==="game"){gate.innerHTML="";render();return}gate.innerHTML=stage==="welcome"?"<h2>🏒 Bienvenue dans Ultimate Hockey Manager</h2><p>Deviens DG : alignements, transactions, repêchage et développement.</p><p class=\"muted\">Comptes et multijoueur en préparation. Démo locale accessible.</p><div class=\"controls\"><button id=\"gwAccount\">Inscription / Connexion</button><button id=\"gwLeagues\">Mes ligues en ligne</button><button id=\"gwDemo\">Essayer la démo</button></div>":stage==="account"?"<h2>Inscription / Connexion</h2><div id=\"uhmGateAccount\"></div><div class=\"controls\"><button id=\"gwBack\">Retour</button><button id=\"gwDemo\">Continuer en démo</button></div>":"<h2>Mes ligues</h2><p class=\"muted\">Crée une ligue en ligne ou rejoins une ligue avec son code. Les ligues sont enregistrées dans Supabase.</p><div class=\"card\"><h3>Créer une ligue</h3><form id=\"uhmCreateLeagueForm\"><input id=\"uhmLeagueName\" maxlength=\"48\" required placeholder=\"Nom de la ligue\" style=\"width:100%;padding:11px;background:#0b2033;color:white;border:1px solid #41627d;border-radius:7px\"><button type=\"submit\" style=\"margin-top:10px\">Créer ma ligue</button></form></div><div class=\"card\"><h3>Rejoindre une ligue</h3><form id=\"uhmJoinLeagueForm\"><input id=\"uhmJoinCode\" maxlength=\"8\" required placeholder=\"Code de la ligue\" autocapitalize=\"characters\" style=\"width:100%;padding:11px;background:#0b2033;color:white;border:1px solid #41627d;border-radius:7px\"><button type=\"submit\" style=\"margin-top:10px\">Rejoindre</button></form></div><div id=\"uhmLeagueStatus\" class=\"muted\" role=\"status\"></div><div id=\"uhmLeagueList\"></div><div class=\"card\"><h3>Ligue de démonstration</h3><p>Partie locale sur cet appareil. Tu peux choisir ton équipe dans Ligue → Équipes.</p><button id=\"gwEnter\">Entrer dans la démo locale</button></div><button id=\"gwBack\">Retour à l’accueil</button>";const bind=(id,fn)=>{const b=gate.querySelector("#"+id);if(b)b.onclick=fn};bind("gwAccount",()=>uhmShowStage("account"));bind("gwLeagues",()=>uhmShowStage("leagues"));bind("gwDemo",()=>uhmShowStage("leagues"));bind("gwBack",()=>uhmShowStage("welcome"));bind("gwEnter",()=>uhmShowStage("game"));if(stage==="account")accountRender();if(stage==="leagues")loadOnlineLeagues();const createForm=gate.querySelector("#uhmCreateLeagueForm");if(createForm)createForm.onsubmit=createOnlineLeague;const joinForm=gate.querySelector("#uhmJoinLeagueForm");if(joinForm)joinForm.onsubmit=joinOnlineLeague}
try{render()}catch(error){console.error("UHM render error",error);const app=document.getElementById("app");if(app)app.innerHTML='<div class="card"><h3>Erreur de chargement</h3><p>Le jeu a rencontré un problème. Ta sauvegarde est conservée.</p><button onclick="location.reload()">Réessayer</button></div>'}
uhmShowStage("welcome");accountRender();initializeOnlineAuth();
</script></body></html>
