name: Refresh player ratings
on:
  push:
    paths:
      - "scripts/build-ratings.mjs"
      - "scripts/apply-player-ratings.mjs"
      - "scripts/lib/cross-league-rating-model.mjs"
      - "scripts/lib/player-ratings.mjs"
      - "scripts/export-registry-index.mjs"
      - "data/ahl/player-stats-2026-2027.json"
      - "data/echl/player-stats-2026-2027.json"
      - "data/junior/player-stats-*.json"
      - "tests/**"
      - ".github/workflows/refresh-ratings.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
permissions:
  contents: write
jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build league-wide ratings from NHL stats
        run: node scripts/build-ratings.mjs
      - name: Complete shared ratings for every registered player
        run: node scripts/apply-player-ratings.mjs
      - name: Export completed player directory
        run: node scripts/export-registry-index.mjs
      - name: Test complete shared player ratings
        run: node --test tests/*.test.mjs
      - name: Commit refreshed ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.json data/free-agents/2026-2027.json data/players/registry.json data/players/registry-index
          if git diff --cached --quiet; then
            echo "Ratings unchanged"
          else
            git commit -m "Refresh shared cross-league player ratings"
            git push
          fi
