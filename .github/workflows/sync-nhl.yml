name: Sync NHL rosters
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
  push:
    paths:
      - '.github/workflows/sync-nhl.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NHL roster data
        run: python scripts/sync_nhl.py
      - name: Fetch NHL prospect data
        run: python scripts/sync_prospects.py
      - name: Commit roster and prospect snapshots
        run: |
          git config user.name "hockey-dynasty-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl data/prospects
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL rosters and prospect snapshots"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
